name: Pipeline correctness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
      - name: Install checksum-pinned FFmpeg and PowerShell 7 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ff = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip' -OutFile $ff
          if ((Get-FileHash $ff -Algorithm SHA256).Hash -ne '04861D3339C5EBE38B56C19A15CF2C0CC97F5DE4FA8910E4D47E5E6404E4A2D4') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive $ff (Join-Path $env:RUNNER_TEMP 'ffmpeg')
          (Join-Path $env:RUNNER_TEMP 'ffmpeg/ffmpeg-7.1.1-essentials_build/bin') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          $pw = Join-Path $env:RUNNER_TEMP 'powershell.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.5.3/PowerShell-7.5.3-win-x64.zip' -OutFile $pw
          if ((Get-FileHash $pw -Algorithm SHA256).Hash -ne '31588931DFCB752D1943F5E633A55337E2F12AF0803D670DB6D90C5937222818') { throw 'PowerShell checksum mismatch' }
          Expand-Archive $pw (Join-Path $env:RUNNER_TEMP 'pwsh')
          (Join-Path $env:RUNNER_TEMP 'pwsh') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Record environment
        shell: bash
        run: |
          python --version > "$RUNNER_TEMP/environment.txt"
          python -m pip freeze >> "$RUNNER_TEMP/environment.txt"
          ffmpeg -version >> "$RUNNER_TEMP/environment.txt"
          ffprobe -version >> "$RUNNER_TEMP/environment.txt"
      - name: Compile and validate source hygiene
        run: |
          python -m compileall -q scripts tests examples
          git diff --check
      - name: Linux real-media and lifecycle suite
        if: runner.os == 'Linux'
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/test-results.txt"
      - name: Windows real-media, lifecycle and PowerShell 5.1/7 suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s tests -v 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'test-results.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/test-results.txt
            ${{ runner.temp }}/environment.txt
          if-no-files-found: warn
          retention-days: 7
